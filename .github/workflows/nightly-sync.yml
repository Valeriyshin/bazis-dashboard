name: Ночной синк рекламных кабинетов

on:
  schedule:
    # 22:00 UTC = 03:00 Алматы (UTC+5) — раз в сутки, тянет "вчера" + окно сверки.
    - cron: "0 22 * * *"
  workflow_dispatch: {} # можно запустить вручную из вкладки Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_AD_ACCOUNT_IDS: ${{ secrets.FB_AD_ACCOUNT_IDS }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
      YANDEX_CURRENCY: KZT
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_ADVERTISER_IDS: ${{ secrets.TIKTOK_ADVERTISER_IDS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      # Каждый кабинет — best-effort: падение одного не должно останавливать остальные
      # (тот же принцип, что и в /api/refresh на сайте).
      - name: Meta
        run: npm run sync
        continue-on-error: true

      - name: Google Ads
        run: npm run sync:google
        continue-on-error: true

      - name: Яндекс.Директ
        run: npm run sync:yandex
        continue-on-error: true

      - name: TikTok
        run: npm run sync:tiktok
        continue-on-error: true
